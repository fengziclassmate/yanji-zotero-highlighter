<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研迹 本文标注</title><link rel="stylesheet" href="ui.css"></head>
<body class="panel-body">
<header class="topbar"><div class="brand"><img src="icons/32.png" alt="">研迹</div><div class="row"><button id="view-zoom" class="zoom-control" title="Ctrl + 滚轮缩放 点击恢复 100%">110%</button><button id="options" class="icon" title="偏好设置" aria-label="偏好设置"></button></div></header>
<main>
<section class="section article-heading"><div class="title-row"><h1 id="title">读取当前文章…</h1><div class="title-actions"><button id="copy-title" class="copy-choice" title="复制完整标题" aria-label="复制完整标题" disabled></button><button id="copy-folder-title" class="copy-choice folder-copy" title="复制文件夹名（去除禁用字符）" aria-label="复制文件夹名称" disabled></button></div></div><div class="metadata-row"><p id="source" class="context-line"></p><button id="copy-doi" class="icon" title="复制 DOI" aria-label="复制 DOI"></button></div><p id="page-status" class="status" role="status"></p></section>
<section id="zotero-section" class="section connection">
<div class="connection-heading"><h2>Zotero</h2><span id="connection-status" class="status" role="status"></span><span id="match-status" class="status" role="status"></span><button id="connect" class="icon" title="检查连接" aria-label="检查连接"></button></div>
<p id="binding" class="bound-title">尚未关联</p><div id="match-results" class="results"></div>
<div class="row sync-actions"><button id="sync" class="primary" aria-label="更新 Zotero 笔记" disabled>更新笔记</button><button id="pdf-open">PDF 标注</button><button id="preview" class="icon" title="预览笔记" aria-label="预览"></button><button id="open-note" class="icon" title="查看笔记" aria-label="查看笔记" hidden></button></div>
<p id="sync-status" class="status" role="status" aria-live="polite"></p><button id="force-sync" class="danger" hidden>重建摘录区，保留总结</button>
<details id="binding-details"><summary>手动关联 / 更换文献</summary><div class="search-row"><input id="query" autocomplete="off" aria-label="DOI、标题或关键词" placeholder="DOI、标题或关键词"><button id="search">查找</button></div><p id="search-status" class="status"></p><div id="results" class="results"></div></details>
</section>
<section id="annotation-section" class="section annotation-section"><div class="summary"><span id="count">0 条标注</span><select id="filter" aria-label="筛选标注分类"><option value="">全部分类</option></select></div><div id="annotations"></div><div id="annotation-pages" class="pager" hidden><button id="ann-prev">上一页</button><span id="ann-page"></span><button id="ann-next">下一页</button></div></section>
<section class="section archive-section"><details id="archive"><summary>已保存的文章</summary><div id="saved-pages" class="archive-list"></div><div id="archive-pages" class="pager" hidden><button id="archive-prev">上一页</button><span id="archive-count"></span><button id="archive-next">下一页</button></div></details></section>
</main>
<footer class="footer"><span>标注本机保存</span><button id="backup-link">配置与备份</button></footer>
<dialog id="preview-dialog"><div class="row between"><strong>分类笔记</strong><button id="close-preview" class="icon" title="关闭预览" aria-label="关闭预览"></button></div><div id="preview-body" class="preview-body"></div></dialog>
<dialog id="sentence-dialog"><div class="dialog-header"><strong>中英句对齐</strong><button id="close-sentences" class="icon" title="关闭句对齐" aria-label="关闭句对齐"></button></div><div class="sentence-controls"><select id="chinese-sentence" aria-label="选择中文句"></select><span id="sentence-origin" class="muted"></span><button id="suggest-sentences" class="quiet">重新预选</button></div><p id="chinese-excerpt" class="quote"></p><div id="english-candidates"></div><div class="dialog-actions"><span id="sentence-status" class="status" role="status"></span><button id="save-sentences" class="primary">保存句对</button></div></dialog>
<dialog id="original-dialog"><div class="row between"><strong>原文段落</strong><button id="close-original" class="icon" title="关闭原文" aria-label="关闭原文"></button></div><div id="original-body" class="preview-body"></div></dialog>
<dialog id="pdf-dialog"><div class="dialog-header"><strong>PDF 标注</strong><button id="pdf-close" class="icon" title="关闭 PDF 标注" aria-label="关闭 PDF 标注"></button></div><div class="pdf-filebar"><span id="pdf-file-name" hidden></span><select id="pdf-attachment" aria-label="选择 PDF"><option value="">选择 PDF</option></select><button id="pdf-scan" class="icon" title="重新定位英文" aria-label="定位英文"></button></div><div id="pdf-results"></div><div class="dialog-actions"><p id="pdf-status" class="status" role="status"></p><div class="row"><button id="pdf-save" class="primary" disabled>写入 PDF 高亮</button><button id="pdf-view" hidden>打开 PDF</button></div></div></dialog>
<script src="shared.js"></script><script src="sentence-rules.js"></script><script src="view.js"></script><script src="panel.js"></script><script src="pdf-ui.js"></script></body></html>
