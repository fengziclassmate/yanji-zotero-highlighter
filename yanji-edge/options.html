<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研迹 偏好设置</title><link rel="stylesheet" href="ui.css"></head>
<body class="options-body"><main class="options-shell">
<header><div class="brand"><img src="icons/32.png" alt=""><h1>研迹<span>偏好设置</span></h1></div><div class="row"><button id="view-zoom" class="zoom-control" title="Ctrl + 滚轮缩放 点击恢复 100%">110%</button><span class="version">v0.5.2</span></div></header>
<nav class="settings-tabs" aria-label="设置分区"><button data-tab="categories-tab" aria-current="page">颜色分类</button><button data-tab="reading-tab">阅读与浮窗</button><button data-tab="zotero-tab">Zotero</button><button data-tab="sharing-tab">配置与备份</button></nav>
<form id="settings-form">
<section id="categories-tab" class="settings-section tab-panel"><div class="section-heading"><div><h2>颜色与分类</h2></div><button id="add-category" type="button">添加分类</button></div><div class="category-row category-labels"><span>颜色</span><span>名称</span><span>含义</span><span>排序</span></div><div id="categories"></div></section>
<section id="reading-tab" class="settings-section tab-panel" hidden><div class="reading-groups"><div class="settings-group"><h2>标注方式</h2><div class="settings-grid">
<div class="field reading-choice"><label for="defaultCategory">默认分类</label><select id="defaultCategory"></select></div><div class="field reading-choice"><label for="style">划线样式</label><div class="style-picker"><select id="style"><option value="both">荧光笔＋下划线</option><option value="highlight">荧光笔</option><option value="underline">下划线</option></select><span id="style-preview" class="style-sample">研迹Zotero网页标注</span></div></div>
<label class="check"><input id="continuous" type="checkbox">选中文字后自动标注</label><label class="check"><input id="shortcuts" type="checkbox">Alt + 1–9 选择分类</label><label class="check"><input id="navDots" type="checkbox">右侧段落导航点</label><label class="check"><input id="badge" type="checkbox">图标显示标注数量</label>
</div></div><div class="settings-group"><h2>选中文字后的浮窗</h2><div class="settings-grid">
<label class="check"><input id="toolbarExpanded" type="checkbox">展开全部分类</label><div class="field"><label for="quickCount">收起时显示分类数</label><select id="quickCount"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option></select></div>
<div class="field"><label for="toolbarOpacity">背景不透明度 <output id="opacity-value"></output></label><input id="toolbarOpacity" type="range" min="50" max="100" step="1"></div><div class="field"><label for="buttonSize">按钮大小 <output id="size-value"></output></label><input id="buttonSize" type="range" min="24" max="36" step="1"></div>
<div class="field"><label for="toolbarWidth">分类浮窗宽度（px）</label><input id="toolbarWidth" type="number" min="220" max="800"></div><div class="field"><label>浮窗尺寸</label><button id="reset-size" type="button">恢复默认尺寸</button></div>
</div></div></div></section>
<section id="zotero-tab" class="settings-section tab-panel" hidden><h2>Zotero 笔记</h2><div class="settings-grid"><div class="field"><label for="noteTitle">笔记标题</label><input id="noteTitle" maxlength="100" required></div><div class="field"><label>保存位置</label><p>我的文献库，文献下的一份笔记</p></div><label class="check"><input id="autoSyncOnOpen" type="checkbox">打开网页时自动更新缓存标注</label></div></section>
<div class="savebar"><p id="save-status" class="status" role="status" aria-live="polite"></p><button type="submit" class="primary">保存偏好</button></div>
</form>
<section id="sharing-tab" class="settings-section tab-panel" hidden><h2>分享给课题组</h2><div class="backup-controls"><button id="export-config">导出配置</button><label for="import-config" tabindex="0" role="button">导入配置</label><input id="import-config" type="file" accept="application/json,.json"></div><p id="config-status" class="status" role="status"></p>
<details id="backup" class="backup-details"><summary>个人数据备份</summary><p class="muted">包含个人标注和定位数据。</p><div class="backup-controls"><button id="export-backup">导出完整备份</button><label for="import-backup" tabindex="0" role="button">导入备份</label><input id="import-backup" type="file" accept="application/json,.json"><button id="export-markdown">导出 Markdown</button></div><p id="backup-status" class="status" role="status"></p></details></section>
</main><script src="shared.js"></script><script src="view.js"></script><script src="files.js"></script><script src="options.js"></script></body></html>
